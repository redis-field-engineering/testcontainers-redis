name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build and stage Maven artifacts
        run: ./gradlew build aggregateTestReports aggregateJacocoReport publish --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            build/reports/aggregate-tests/
            subprojects/*/build/test-results/test/
